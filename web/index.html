<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsTrade — 加密新闻监控</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --surface2: #1e2330;
    --border: #2a3045;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.15);
    --bullish: #10b981;
    --bearish: #ef4444;
    --neutral: #f59e0b;
    --bullish-bg: rgba(16,185,129,0.1);
    --bearish-bg: rgba(239,68,68,0.1);
    --neutral-bg: rgba(245,158,11,0.1);
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,15,20,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    font-weight: 700; font-size: 1.15rem; letter-spacing: -0.5px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .header-stats {
    display: flex; gap: 20px; margin-left: auto;
    font-size: 0.8rem; color: var(--muted);
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── LAYOUT ── */
  .container {
    max-width: 1280px; margin: 0 auto;
    padding: 24px 24px 60px;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 20px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .filter-group {
    display: flex; flex-direction: column; gap: 4px;
    flex: 1; min-width: 120px;
  }
  .filter-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  select, input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  select:focus, input[type="text"]:focus { border-color: var(--accent); }
  .filter-actions {
    display: flex; align-items: flex-end; gap: 8px;
  }
  button {
    cursor: pointer;
    border: none; border-radius: 6px;
    font-size: 0.85rem; font-weight: 500;
    padding: 7px 16px;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
  }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost {
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* ── TABS / signal quick-filters ── */
  .signal-tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 5px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  .tab.active-all   { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
  .tab.active-bull  { background: var(--bullish-bg); color: var(--bullish); border-color: var(--bullish); }
  .tab.active-bear  { background: var(--bearish-bg); color: var(--bearish); border-color: var(--bearish); }
  .tab.active-neut  { background: var(--neutral-bg); color: var(--neutral); border-color: var(--neutral); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
    font-size: 0.8rem; color: var(--muted);
  }

  /* ── GRID ── */
  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }
  .card.signal-bullish::before { background: var(--bullish); }
  .card.signal-bearish::before { background: var(--bearish); }
  .card.signal-neutral::before { background: var(--neutral); }
  .card:hover {
    border-color: #3a4560;
    box-shadow: var(--shadow);
  }

  .card-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge-type { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .badge-engine { background: rgba(59,130,246,0.1); color: #93c5fd; }
  .card-time { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

  .card-text {
    font-size: 0.88rem; color: var(--text); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .ai-rating {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    font-size: 0.8rem;
  }
  .ai-rating.bullish { background: var(--bullish-bg); border: 1px solid rgba(16,185,129,0.2); }
  .ai-rating.bearish { background: var(--bearish-bg); border: 1px solid rgba(239,68,68,0.2); }
  .ai-rating.neutral { background: var(--neutral-bg); border: 1px solid rgba(245,158,11,0.2); }
  .ai-signal-label {
    font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .ai-rating.bullish .ai-signal-label { color: var(--bullish); }
  .ai-rating.bearish .ai-signal-label { color: var(--bearish); }
  .ai-rating.neutral .ai-signal-label { color: var(--neutral); }
  .ai-score-bar {
    flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden;
  }
  .ai-score-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.4s ease;
  }
  .bullish .ai-score-fill { background: var(--bullish); }
  .bearish .ai-score-fill { background: var(--bearish); }
  .neutral  .ai-score-fill { background: var(--neutral); }
  .ai-score-text { font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
  .ai-grade { font-weight: 600; color: var(--muted); margin-left: auto; }

  .coins-row {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .coin-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px;
    font-size: 0.75rem;
  }
  .coin-sym { font-weight: 700; color: var(--text); }
  .coin-sig { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; }
  .sig-buy  { color: var(--bullish); }
  .sig-sell { color: var(--bearish); }
  .sig-hold { color: var(--neutral); }

  .card-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent); font-size: 0.78rem;
    text-decoration: none;
    width: fit-content;
  }
  .card-link:hover { text-decoration: underline; }

  /* ── PAGINATION ── */
  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-top: 32px;
    flex-wrap: wrap;
  }
  .page-btn {
    width: 36px; height: 36px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border);
    font-size: 0.85rem; cursor: pointer;
    transition: all 0.15s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-btn.wide { width: auto; padding: 0 12px; }
  .page-info { color: var(--muted); font-size: 0.8rem; padding: 0 8px; }

  /* ── EMPTY / LOADING / ERROR ── */
  .state-box {
    text-align: center; padding: 60px 20px;
    color: var(--muted); grid-column: 1/-1;
  }
  .state-box .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .state-box p { font-size: 0.9rem; }

  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .header-stats { display: none; }
    .news-grid { grid-template-columns: 1fr; }
    .filter-bar { flex-direction: column; }
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    NewsTrade Monitor
  </div>
  <div class="header-stats">
    <div class="stat-item">总条数 <span class="stat-val" id="hdr-total">—</span></div>
    <div class="stat-item">本页 <span class="stat-val" id="hdr-count">—</span></div>
  </div>
</header>

<div class="container">

  <!-- filter bar -->
  <div class="filter-bar">
    <div class="filter-group" style="flex:2;min-width:200px">
      <div class="filter-label">关键词搜索</div>
      <input type="text" id="f-search" placeholder="搜索新闻内容…" />
    </div>
    <div class="filter-group">
      <div class="filter-label">AI Signal</div>
      <select id="f-signal">
        <option value="">全部</option>
      </select>
    </div>
    <div class="filter-group">
      <div class="filter-label">新闻类型</div>
      <select id="f-newstype">
        <option value="">全部</option>
      </select>
    </div>
    <div class="filter-group">
      <div class="filter-label">引擎</div>
      <select id="f-engine">
        <option value="">全部</option>
      </select>
    </div>
    <div class="filter-group">
      <div class="filter-label">代币符号</div>
      <input type="text" id="f-symbol" placeholder="BTC, ETH…" />
    </div>
    <div class="filter-group">
      <div class="filter-label">每页</div>
      <select id="f-pagesize">
        <option value="12">12</option>
        <option value="24" selected>24</option>
        <option value="48">48</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn-ghost" onclick="resetFilters()">重置</button>
      <button class="btn-primary" onclick="fetchPage(1)">搜索</button>
    </div>
  </div>

  <!-- signal quick-tabs -->
  <div class="signal-tabs" id="signal-tabs">
    <div class="tab active-all" data-val="" onclick="quickSignal(this, '')">全部</div>
    <div class="tab" data-val="bullish" onclick="quickSignal(this,'bullish')">📈 看涨</div>
    <div class="tab" data-val="bearish" onclick="quickSignal(this,'bearish')">📉 看跌</div>
    <div class="tab" data-val="neutral" onclick="quickSignal(this,'neutral')">⚖️ 中性</div>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <span id="result-info">加载中…</span>
    <span id="last-updated"></span>
  </div>

  <!-- news grid -->
  <div class="news-grid" id="news-grid">
    <div class="state-box">
      <div class="icon">⏳</div>
      <p>正在加载数据…</p>
    </div>
  </div>

  <!-- pagination -->
  <div class="pagination" id="pagination"></div>

</div>

<script>
const state = { page: 1, pageSize: 24, signal: '', newsType: '', engine: '', symbol: '', search: '' };

/* ──────────────────────────────────── API ──── */
async function fetchPage(page) {
  state.page = page;
  state.signal   = document.getElementById('f-signal').value;
  state.newsType = document.getElementById('f-newstype').value;
  state.engine   = document.getElementById('f-engine').value;
  state.symbol   = document.getElementById('f-symbol').value.trim().toUpperCase();
  state.search   = document.getElementById('f-search').value.trim();
  state.pageSize = parseInt(document.getElementById('f-pagesize').value, 10);

  renderSkeletons();
  try {
    const q = new URLSearchParams({
      page:      state.page,
      page_size: state.pageSize,
      ...(state.signal   && { signal:     state.signal }),
      ...(state.newsType && { news_type:  state.newsType }),
      ...(state.engine   && { engine:     state.engine }),
      ...(state.symbol   && { symbol:     state.symbol }),
      ...(state.search   && { search:     state.search }),
    });
    const res = await fetch(`/api/news?${q}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderGrid(data);
    renderPagination(data);
    updateHeader(data);
    document.getElementById('last-updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    renderError(e.message);
  }
}

/* ──────────────────────────────────── RENDER ── */
function renderSkeletons() {
  const grid = document.getElementById('news-grid');
  grid.innerHTML = Array.from({length: state.pageSize}, () => `
    <div class="card" style="gap:12px">
      <div class="skeleton" style="height:14px;width:60%"></div>
      <div class="skeleton" style="height:50px"></div>
      <div class="skeleton" style="height:32px"></div>
    </div>`).join('');
}

function renderGrid(data) {
  const grid = document.getElementById('news-grid');
  if (!data.articles.length) {
    grid.innerHTML = `<div class="state-box"><div class="icon">🔍</div><p>没有找到匹配的新闻</p></div>`;
    document.getElementById('result-info').textContent = '共 0 条';
    return;
  }
  grid.innerHTML = data.articles.map(renderCard).join('');
}

function renderCard(a) {
  const sig  = (a.ai_signal || '').toLowerCase();
  const sigClass = sig === 'bullish' ? 'bullish' : sig === 'bearish' ? 'bearish' : sig ? 'neutral' : '';
  const sigLabel = sig === 'bullish' ? '📈 看涨' : sig === 'bearish' ? '📉 看跌' : sig ? '⚖️ 中性' : '';
  const ts = a.ts || a.created_at;
  const timeStr = ts ? relTime(ts) : '';

  const aiBlock = a.ai_score != null ? `
    <div class="ai-rating ${sigClass}">
      <span class="ai-signal-label">${sigLabel || sig}</span>
      <div class="ai-score-bar"><div class="ai-score-fill" style="width:${Math.min(100,Math.abs(a.ai_score))}%"></div></div>
      <span class="ai-score-text" style="color:var(--${sigClass || 'muted'})">${a.ai_score}</span>
      ${a.ai_grade ? `<span class="ai-grade">${a.ai_grade}</span>` : ''}
    </div>` : '';

  const coinsBlock = a.coins && a.coins.length ? `
    <div class="coins-row">
      ${a.coins.slice(0,8).map(c => {
        const cs = (c.signal||'').toLowerCase();
        const cc = cs.includes('buy')||cs.includes('bull') ? 'sig-buy' : cs.includes('sell')||cs.includes('bear') ? 'sig-sell' : 'sig-hold';
        return `<div class="coin-chip"><span class="coin-sym">${esc(c.symbol)}</span>${c.signal?`<span class="coin-sig ${cc}">${esc(c.signal)}</span>`:''}</div>`;
      }).join('')}
      ${a.coins.length > 8 ? `<div class="coin-chip"><span class="coin-sym">+${a.coins.length-8}</span></div>` : ''}
    </div>` : '';

  const linkBlock = a.link ? `<a class="card-link" href="${esc(a.link)}" target="_blank" rel="noopener">
    阅读原文 <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 10L10 2M5 2h5v5"/></svg>
  </a>` : '';

  return `
  <div class="card ${sigClass ? 'signal-'+sigClass : ''}">
    <div class="card-meta">
      ${a.news_type ? `<span class="badge badge-type">${esc(a.news_type)}</span>` : ''}
      ${a.engine_type ? `<span class="badge badge-engine">${esc(a.engine_type)}</span>` : ''}
      <span class="card-time">${timeStr}</span>
    </div>
    <div class="card-text">${esc(a.text)}</div>
    ${aiBlock}
    ${coinsBlock}
    ${linkBlock}
  </div>`;
}

function renderPagination(data) {
  const totalPages = Math.ceil(data.total / data.page_size);
  const cur = data.page;
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = '';
  html += `<button class="page-btn wide" ${cur===1?'disabled':''} onclick="fetchPage(${cur-1})">‹ 上一页</button>`;

  const pages = getPageNumbers(cur, totalPages);
  let prev = null;
  for (const p of pages) {
    if (prev !== null && p - prev > 1) html += `<span class="page-info">…</span>`;
    html += `<button class="page-btn ${p===cur?'active':''}" onclick="fetchPage(${p})">${p}</button>`;
    prev = p;
  }

  html += `<button class="page-btn wide" ${cur===totalPages?'disabled':''} onclick="fetchPage(${cur+1})">下一页 ›</button>`;
  html += `<span class="page-info">${cur} / ${totalPages} 页</span>`;
  el.innerHTML = html;
}

function getPageNumbers(cur, total) {
  const delta = 2;
  const range = new Set([1, total]);
  for (let i = Math.max(2, cur-delta); i <= Math.min(total-1, cur+delta); i++) range.add(i);
  return [...range].sort((a,b)=>a-b);
}

function updateHeader(data) {
  document.getElementById('hdr-total').textContent = data.total.toLocaleString();
  document.getElementById('hdr-count').textContent = data.articles.length;
  const start = (data.page-1)*data.page_size+1;
  const end   = Math.min(data.page*data.page_size, data.total);
  document.getElementById('result-info').textContent =
    `共 ${data.total.toLocaleString()} 条，显示第 ${start}–${end} 条`;
}

function renderError(msg) {
  document.getElementById('news-grid').innerHTML =
    `<div class="state-box"><div class="icon">⚠️</div><p>加载失败：${esc(msg)}</p></div>`;
}

/* ──────────────────────────────────── FILTERS ── */
async function loadFilterOptions() {
  try {
    const res = await fetch('/api/news/filters');
    if (!res.ok) return;
    const data = await res.json();

    const sigSel = document.getElementById('f-signal');
    (data.signals || []).forEach(s => {
      const o = new Option(s, s);
      sigSel.add(o);
    });

    const ntSel = document.getElementById('f-newstype');
    (data.news_types || []).forEach(s => {
      ntSel.add(new Option(s, s));
    });

    const engSel = document.getElementById('f-engine');
    (data.engine_types || []).forEach(s => {
      engSel.add(new Option(s, s));
    });
  } catch(_) {}
}

function quickSignal(el, val) {
  document.querySelectorAll('#signal-tabs .tab').forEach(t => {
    t.className = 'tab';
  });
  const cls = val === 'bullish' ? 'active-bull' : val === 'bearish' ? 'active-bear' : val ? 'active-neut' : 'active-all';
  el.className = 'tab ' + cls;
  document.getElementById('f-signal').value = val;
  fetchPage(1);
}

function resetFilters() {
  document.getElementById('f-signal').value = '';
  document.getElementById('f-newstype').value = '';
  document.getElementById('f-engine').value = '';
  document.getElementById('f-symbol').value = '';
  document.getElementById('f-search').value = '';
  document.querySelectorAll('#signal-tabs .tab').forEach(t => t.className = 'tab');
  document.querySelector('#signal-tabs .tab[data-val=""]').className = 'tab active-all';
  fetchPage(1);
}

/* ──────────────────────────────────── UTILS ── */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relTime(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)   return `${Math.floor(diff)}秒前`;
  if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
  if (diff < 86400)return `${Math.floor(diff/3600)}小时前`;
  return new Date(iso).toLocaleDateString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* search on Enter */
document.getElementById('f-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchPage(1);
});
document.getElementById('f-symbol').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchPage(1);
});

/* ── INIT ── */
loadFilterOptions();
fetchPage(1);
</script>
</body>
</html>
